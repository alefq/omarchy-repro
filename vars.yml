---
vm_name: omarchy-repro
vm_memory_mib: 8192
vm_vcpus: 4
# 80 GiB default. Floor 70: Omarchy needs ≥32 GiB free; 50/50 of 64 GiB is exact, no margin.
vm_disk_gib: 80
# Keep this outside $HOME: qemu:///system runs as the libvirt qemu user
# and cannot traverse a 0700/0750 home. /var/tmp is 1777 on most Unix systems.
# Do not use a path under $HOME or a symlink that points into one.
vm_dir: /var/tmp/omarchy-repro
vm_disk_path: "{{ vm_dir }}/{{ vm_name }}.qcow2"
vm_raw_path: "{{ vm_dir }}/{{ vm_name }}.raw"
omarchy_iso: /var/tmp/omarchy.iso
vm_transient: true
libvirt_uri: qemu:///system
vm_network: default
required_commands:
  - qemu-img
  - virt-install
  - virsh
  - virt-viewer
  - parted
  - mkfs.ext4
ovmf_candidates:
  - /usr/share/OVMF/OVMF_CODE_4M.fd
  - /usr/share/OVMF/OVMF_CODE.fd
  - /usr/share/edk2/ovmf/OVMF_CODE.fd
  - /usr/share/edk2-ovmf/x64/OVMF_CODE.fd
  - /usr/share/qemu/edk2-x86_64-code.fd
  - /usr/share/qemu/edk2-x86_64-secure-code.fd
