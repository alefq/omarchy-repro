---
vm_name: omarchy-repro
vm_memory_mib: 8192
vm_vcpus: 4
# 80 G default. Piso 70: Omarchy pide ≥32 G libres y el 50/50 de 64 G queda justo, sin colchón.
vm_disk_gib: 80
# Fuera de $HOME: qemu:///system corre como libvirt-qemu y no atraviesa
# un home 0700/0750. /var/tmp es 1777; el usuario crea vm_dir sin sudo.
# No uses un path bajo $HOME ni un symlink que apunte adentro.
vm_dir: /var/tmp/omarchy-repro
vm_disk_path: "{{ vm_dir }}/{{ vm_name }}.qcow2"
vm_raw_path: "{{ vm_dir }}/{{ vm_name }}.raw"
omarchy_iso: /var/tmp/omarchy.iso
vm_transient: true
libvirt_uri: qemu:///system
vm_network: default
host_packages:
  - qemu-system-x86
  - qemu-utils
  - libvirt-daemon-system
  - libvirt-clients
  - virtinst
  - ovmf
  - virt-viewer
  - parted
  - e2fsprogs
