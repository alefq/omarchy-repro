---
# Ephemeral VM. Default: bring it up. Tear it down with:
#   ansible-playbook playbook.yml --tags down
# Runs as the invoking user. Checks tools on PATH, not package names.
- name: Ephemeral KVM VM for the Omarchy ESP bug
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars.yml

  tasks:
    - name: Check KVM device
      ansible.builtin.stat:
        path: /dev/kvm
      register: kvm_dev
      tags: [check]

    - name: Fail if /dev/kvm is missing
      ansible.builtin.fail:
        msg: >-
          /dev/kvm does not exist. Enable virtualization in firmware
          (SVM or VT-x) and load kvm_amd or kvm_intel.
          The playbook does not install or configure the host.
      when: not kvm_dev.stat.exists
      tags: [check]

    - name: Fail if /dev/kvm is not accessible
      ansible.builtin.fail:
        msg: |
          /dev/kvm exists but this user cannot read/write it.
          This user must be allowed to use KVM (group kvm, qemu, or
          whatever the distro assigns to that node). Reload groups /
          session after adding the user. Ubuntu: RUN-UBUNTU.md
      when: >-
        kvm_dev.stat.exists
        and (not kvm_dev.stat.readable or not kvm_dev.stat.writeable)
      tags: [check]

    - name: Commands on PATH
      ansible.builtin.shell:
        cmd: command -v "{{ item }}"
        executable: /bin/bash
      loop: "{{ required_commands }}"
      register: cmd_check
      changed_when: false
      failed_when: false
      tags: [check]

    - name: Fail if commands are missing
      ansible.builtin.fail:
        msg: |
          Missing commands: {{ missing_commands | join(' ') }}
          The playbook does not install packages; names differ by distro.
          Ubuntu (verified run): RUN-UBUNTU.md
      when: missing_commands | length > 0
      vars:
        missing_commands: "{{ cmd_check.results | selectattr('rc', 'ne', 0) | map(attribute='item') | list }}"
      tags: [check]

    - name: UEFI firmware (OVMF / edk2)
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ ovmf_candidates }}"
      register: ovmf_files
      tags: [check]

    - name: Fail if UEFI firmware is missing
      ansible.builtin.fail:
        msg: |
          No UEFI firmware (OVMF / edk2) found on the known paths.
          The playbook does not install packages. Ubuntu: RUN-UBUNTU.md (ovmf).
      when: ovmf_files.results | map(attribute='stat') | selectattr('exists') | list | length == 0
      tags: [check]

    - name: Disk and ISO paths traversable by libvirt qemu
      ansible.builtin.shell: |
        set -euo pipefail
        blocked=""
        walk() {
          local p="$1"
          [[ -e "$p" && ! -d "$p" ]] && p=$(dirname "$p")
          while [[ ! -e "$p" && "$p" != "/" ]]; do
            p=$(dirname "$p")
          done
          while [[ "$p" != "/" ]]; do
            others=$(( 8#$(stat -c %a "$p") % 8 ))
            if (( others % 2 == 0 )); then
              blocked+="$p "
            fi
            p=$(dirname "$p")
          done
        }
        walk "{{ vm_dir }}"
        walk "{{ omarchy_iso }}"
        if [[ -f "{{ omarchy_iso }}" ]]; then
          others=$(( 8#$(stat -c %a "{{ omarchy_iso }}") % 8 ))
          if (( others < 4 )); then
            blocked+="{{ omarchy_iso }}(no-o+r) "
          fi
        fi
        if [[ -n "$blocked" ]]; then
          echo "$blocked"
          exit 1
        fi
      args:
        executable: /bin/bash
      register: qemu_traverse
      failed_when: false
      changed_when: false
      tags: [check]

    - name: Fail if qemu cannot traverse the disk or ISO
      ansible.builtin.fail:
        msg: |
          qemu for {{ libvirt_uri }} cannot use:
            {{ qemu_traverse.stdout | trim }}
          Disk and ISO must live on a path traversable by others
          (defaults {{ vm_dir }} / {{ omarchy_iso }}). A symlink into a
          0700 home directory is not enough. The playbook does not
          change $HOME permissions.
      when: qemu_traverse.rc != 0
      tags: [check]

    - name: Validate disk against Omarchy minimum
      ansible.builtin.assert:
        that:
          - (vm_disk_gib | int) >= 70
        fail_msg: >-
          Omarchy requires at least 32 GiB of free space. With a 50/50
          backup split, 64 GiB is exactly on the limit and may be rejected.
          Use at least 70 GiB (80 recommended). Pass -e vm_disk_gib=80.
      tags: [check]

    - name: libvirt responds
      ansible.builtin.command:
        argv: [virsh, --connect, "{{ libvirt_uri }}", uri]
      register: virsh_uri
      changed_when: false
      failed_when: false
      tags: [check]

    - name: Fail if libvirt is not running
      ansible.builtin.fail:
        msg: |
          virsh cannot talk to {{ libvirt_uri }} (rc={{ virsh_uri.rc }}).
          The playbook does not start the daemon. Start libvirt the way
          your distro expects (libvirtd or virtqemud). Ubuntu: RUN-UBUNTU.md
      when: virsh_uri.rc != 0
      tags: [check]

    - name: libvirt network is active
      ansible.builtin.command:
        argv: [virsh, --connect, "{{ libvirt_uri }}", net-info, "{{ vm_network }}"]
      register: net_default
      failed_when: false
      changed_when: false
      tags: [check]

    - name: Fail if the libvirt network is not active
      ansible.builtin.fail:
        msg: |
          libvirt network '{{ vm_network }}' is missing or inactive.
          The playbook does not start it. On the host (not via this playbook):

            virsh --connect {{ libvirt_uri }} net-start {{ vm_network }}
      when: net_default.rc != 0 or not (net_default.stdout is search("Active:\\s+yes"))
      tags: [check]

    - name: ISO is present
      ansible.builtin.stat:
        path: "{{ omarchy_iso }}"
      register: iso
      tags: [check]

    - name: Fail if the ISO is missing
      ansible.builtin.fail:
        msg: >-
          ISO not found at {{ omarchy_iso }}.
          Pass -e omarchy_iso=/path/to/omarchy.iso
          (https://iso.omarchy.org/).
      when: not iso.stat.exists
      tags: [check]

    - name: Tear down leftovers from a previous run
      ansible.builtin.include_tasks: tasks/teardown.yml

    - name: VM image directory
      ansible.builtin.file:
        path: "{{ vm_dir }}"
        state: directory
        mode: "0755"

    - name: Sparse raw disk
      ansible.builtin.command:
        argv:
          - qemu-img
          - create
          - -f
          - raw
          - "{{ vm_raw_path }}"
          - "{{ vm_disk_gib }}G"
      args:
        creates: "{{ vm_raw_path }}"

    - name: Partition 50% free + ext4 backup (no ESP, no root)
      ansible.builtin.shell: |
        set -euo pipefail
        RAW="{{ vm_raw_path }}"
        QCOW="{{ vm_disk_path }}"
        parted --script "$RAW" \
          mklabel gpt \
          mkpart backup 50% 100% \
          name 1 backup
        line=$(parted --script -m "$RAW" unit B print | grep '^1:')
        start=${line#*:}
        start=${start%%B*}
        size=$(printf '%s\n' "$line" | cut -d: -f4)
        size=${size%B}
        blocks=$(( size / 4096 ))
        mkfs.ext4 -F -L backup -E "offset=${start}" "$RAW" "$blocks"
        qemu-img convert -f raw -O qcow2 "$RAW" "$QCOW"
        rm -f "$RAW"
      args:
        executable: /bin/bash
      changed_when: true

    # EFI NVRAM is not usable with virsh create (transient). Define + start.
    - name: Render domain XML
      ansible.builtin.command:
        argv:
          - virt-install
          - --connect
          - "{{ libvirt_uri }}"
          - --name
          - "{{ vm_name }}"
          - --memory
          - "{{ vm_memory_mib }}"
          - --vcpus
          - "{{ vm_vcpus }}"
          - --cpu
          - host-passthrough
          - --machine
          - q35
          - --virt-type
          - kvm
          - --disk
          - "path={{ vm_disk_path }},format=qcow2,bus=virtio,cache=none,discard=unmap"
          - --cdrom
          - "{{ omarchy_iso }}"
          - --os-variant
          - generic
          - --network
          - "network={{ vm_network }},model=virtio"
          - --graphics
          - spice
          - --video
          - virtio
          - --boot
          - firmware=efi,firmware.feature0.name=secure-boot,firmware.feature0.enabled=no,cdrom,hd
          - --events
          - "{{ virt_events }}"
          - --noreboot
          - --check
          - all=off
          - --dry-run
          - --print-xml
      vars:
        virt_events: >-
          {{ 'on_poweroff=destroy,on_reboot=destroy,on_crash=destroy'
             if vm_transient | bool else
             'on_poweroff=destroy,on_reboot=restart,on_crash=destroy' }}
      register: virt_xml
      changed_when: false

    - name: Write domain XML
      ansible.builtin.copy:
        dest: "{{ vm_xml_path }}"
        content: "{{ virt_xml.stdout }}"
        mode: "0644"

    - name: Set domain seclabel
      ansible.builtin.shell: |
        set -euo pipefail
        python3 - "{{ vm_xml_path }}" "{{ vm_seclabel }}" <<'PY'
        import re
        import sys

        path, seclabel = sys.argv[1], sys.argv[2]
        text = open(path, encoding="utf-8").read()
        match = re.search(r"<domain\b[\s\S]*?</domain>", text)
        if not match:
            sys.stderr.write("virt-install --print-xml produced no <domain>\n")
            sys.exit(1)
        xml = match.group(0)
        xml = re.sub(r"\s*<seclabel\b[^>]*(?:/>|>[\s\S]*?</seclabel>)", "", xml)
        if seclabel:
            xml = re.sub(
                r"</domain>\s*$",
                '  <seclabel type="%s"/>\n</domain>\n' % seclabel,
                xml,
            )
        open(path, "w", encoding="utf-8").write(xml)
        PY
      args:
        executable: /bin/bash

    - name: Define the VM
      ansible.builtin.command:
        argv:
          - virsh
          - --connect
          - "{{ libvirt_uri }}"
          - define
          - "{{ vm_xml_path }}"
      register: virsh_define
      failed_when: false
      changed_when: virsh_define.rc == 0

    - name: Fail if virsh define failed
      ansible.builtin.fail:
        msg: |
          virsh define failed (rc={{ virsh_define.rc }}).
          {{ virsh_define.stderr }}
      when: virsh_define.rc != 0

    - name: Start the VM
      ansible.builtin.command:
        argv:
          - virsh
          - --connect
          - "{{ libvirt_uri }}"
          - start
          - "{{ vm_name }}"
      register: virsh_start
      failed_when: false
      changed_when: virsh_start.rc == 0

    - name: Fail if AppArmor blocked start
      ansible.builtin.fail:
        msg: |
          libvirt could not load an AppArmor profile for this domain.
          qemu:///system confines each VM; virt-aa-helper typically cannot
          read {{ vm_dir }} / {{ omarchy_iso }} (it allows
          /var/lib/libvirt/images, not /var/tmp).
          The domain XML already has <seclabel type='{{ vm_seclabel }}'/>.
          If that is none and this still failed, the host requires (once):

            # in /etc/libvirt/qemu.conf
            security_driver = "none"
            sudo systemctl restart libvirtd

          The playbook does not change qemu.conf. Pass -e vm_seclabel=none,
          or put the disk and ISO in a path the helper already allows.
      when: >-
        virsh_start.rc != 0
        and (virsh_start.stderr is search("cannot load AppArmor profile"))

    - name: Fail if virsh start failed
      ansible.builtin.fail:
        msg: |
          virsh start failed (rc={{ virsh_start.rc }}).
          {{ virsh_start.stderr }}
      when: virsh_start.rc != 0

    - name: Domain state
      ansible.builtin.command:
        argv:
          - virsh
          - --connect
          - "{{ libvirt_uri }}"
          - domstate
          - "{{ vm_name }}"
      register: domstate
      changed_when: false

    - name: Fail if the domain is not running
      ansible.builtin.fail:
        msg: |
          Domain {{ vm_name }} is '{{ domstate.stdout | trim }}', expected running.
          URI: {{ libvirt_uri }}
          Check: virsh --connect {{ libvirt_uri }} list --all
      when: (domstate.stdout | trim) != "running"

    - name: Reminder
      ansible.builtin.debug:
        msg:
          - "VM {{ vm_name }} is running ({{ libvirt_uri }}, state={{ domstate.stdout | trim }})."
          - "Console: virt-viewer --connect {{ libvirt_uri }} {{ vm_name }}"
          - "List: virsh --connect {{ libvirt_uri }} list --all"
          - "Disk vda = {{ vm_disk_gib }} GiB, 50% free + ext4 backup. No ESP."
          - "In the installer: disk vda → Free space install (do not wipe)."
          - "The failure is immediate (parted + mkfs + ESP mount), not an ISO copy."
          - "Expected error: mounting the ESP failed / SQUASHFS superblock."
          - "Tear down: ansible-playbook playbook.yml --tags down"

- name: Destroy the VM and disk
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [never, down]
  vars_files:
    - vars.yml
  tasks:
    - name: Teardown
      ansible.builtin.include_tasks: tasks/teardown.yml

    - name: Done
      ansible.builtin.debug:
        msg: "VM {{ vm_name }} and {{ vm_dir }} removed."
