---
# Ambiente efímero: por defecto levanta la VM. Para tirarla:
#   ansible-playbook playbook.yml --tags down
# No usa become en ningún task: corre como el usuario invocante, que debe
# estar en los grupos libvirt y kvm (ver README).
- name: VM KVM efímera para el bug ESP de Omarchy
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars.yml

  tasks:
    - name: Comprobar KVM
      ansible.builtin.stat:
        path: /dev/kvm
      register: kvm_dev
      tags: [check]

    - name: Fallar si no hay /dev/kvm
      ansible.builtin.fail:
        msg: >-
          No existe /dev/kvm. Activá SVM/AMD-V en la BIOS, recargá kvm_amd
          y comprobá con: kvm-ok
      when: not kvm_dev.stat.exists
      tags: [check]

    - name: Acceso a /dev/kvm
      ansible.builtin.command:
        argv: [test, -r, /dev/kvm, -a, -w, /dev/kvm]
      register: kvm_rw
      failed_when: false
      changed_when: false
      tags: [check]

    - name: Fallar si /dev/kvm no es accesible
      ansible.builtin.fail:
        msg: |
          /dev/kvm existe pero este usuario no puede leerlo/escribirlo.
          El playbook no corre sudo. En el host, una vez:

            sudo usermod -aG kvm "$USER"
          Cerrá sesión y volvé a entrar.
      when: kvm_dev.stat.exists and kvm_rw.rc != 0
      tags: [check]

    - name: Grupos libvirt y kvm
      ansible.builtin.command:
        argv: [id, -nG]
      register: user_groups
      changed_when: false
      tags: [check]

    - name: Fallar si faltan grupos
      ansible.builtin.fail:
        msg: |
          Este usuario no está en kvm y/o libvirt (grupos: {{ user_groups.stdout }}).
          Hace falta para qemu:///system y /dev/kvm.
          El playbook no corre sudo. En el host, una vez:

            sudo usermod -aG libvirt,kvm "$USER"
          Cerrá sesión y volvé a entrar.
      when: >-
        ('kvm' not in user_groups.stdout.split()) or
        ('libvirt' not in user_groups.stdout.split())
      tags: [check]

    - name: Paths del disco e ISO transitables por libvirt-qemu
      ansible.builtin.shell: |
        set -euo pipefail
        blocked=""
        walk() {
          local p="$1"
          [[ -e "$p" && ! -d "$p" ]] && p=$(dirname "$p")
          while [[ ! -e "$p" && "$p" != "/" ]]; do
            p=$(dirname "$p")
          done
          while [[ "$p" != "/" ]]; do
            others=$(( 8#$(stat -c %a "$p") % 8 ))
            if (( others % 2 == 0 )); then
              blocked+="$p "
            fi
            p=$(dirname "$p")
          done
        }
        walk "{{ vm_dir }}"
        walk "{{ omarchy_iso }}"
        if [[ -f "{{ omarchy_iso }}" ]]; then
          others=$(( 8#$(stat -c %a "{{ omarchy_iso }}") % 8 ))
          if (( others < 4 )); then
            blocked+="{{ omarchy_iso }}(no-o+r) "
          fi
        fi
        if [[ -n "$blocked" ]]; then
          echo "$blocked"
          exit 1
        fi
      args:
        executable: /bin/bash
      register: qemu_traverse
      failed_when: false
      changed_when: false
      tags: [check]

    - name: Fallar si qemu no puede transitar disco o ISO
      ansible.builtin.fail:
        msg: |
          qemu:///system corre como libvirt-qemu y no puede usar:
            {{ qemu_traverse.stdout | trim }}
          No aflojes $HOME. Disco e ISO tienen que vivir fuera
          (default: /var/tmp). Un symlink al home no alcanza.

            mkdir -p /var/tmp/omarchy-repro
            cp --reflink=auto "{{ omarchy_iso }}" /var/tmp/omarchy.iso
            chmod 0644 /var/tmp/omarchy.iso

          Después: -e omarchy_iso=/var/tmp/omarchy.iso
          (vm_dir ya default a /var/tmp/omarchy-repro).
      when: qemu_traverse.rc != 0
      tags: [check]

    - name: Validar disco vs. mínimo de Omarchy
      ansible.builtin.assert:
        that:
          - (vm_disk_gib | int) >= 70
        fail_msg: >-
          Omarchy pide ≥32 G de free space. Con backup al 50%, 64 G queda
          justo en el límite y puede rechazarlo. Usá ≥70 G (recomendado 80).
          Pasá -e vm_disk_gib=80.
      tags: [check]

    - name: Inventario de paquetes
      ansible.builtin.package_facts:
        manager: auto
      tags: [check]

    - name: Paquetes faltantes
      ansible.builtin.set_fact:
        missing_packages: "{{ host_packages | reject('in', ansible_facts.packages) | list }}"
      tags: [check]

    - name: Fallar si faltan paquetes
      ansible.builtin.fail:
        msg: |
          Faltan paquetes: {{ missing_packages | join(' ') }}

          El playbook no instala nada. En el host:

            sudo apt update
            sudo apt install -y {{ missing_packages | join(' ') }}
      when: missing_packages | length > 0
      tags: [check]

    - name: libvirt responde
      ansible.builtin.command:
        argv: [virsh, --connect, "{{ libvirt_uri }}", uri]
      register: virsh_uri
      changed_when: false
      failed_when: false
      tags: [check]

    - name: Fallar si libvirt no está activo
      ansible.builtin.fail:
        msg: |
          virsh no habla con {{ libvirt_uri }} (rc={{ virsh_uri.rc }}).
          El playbook no arranca el daemon. En el host:

            sudo systemctl start libvirtd

          Si el host usa daemons modulares (virtqemud):

            sudo systemctl start virtqemud.socket virtnetworkd.socket
      when: virsh_uri.rc != 0
      tags: [check]

    - name: Red libvirt activa
      ansible.builtin.command:
        argv: [virsh, --connect, "{{ libvirt_uri }}", net-info, "{{ vm_network }}"]
      register: net_default
      failed_when: false
      changed_when: false
      tags: [check]

    - name: Fallar si la red libvirt no está activa
      ansible.builtin.fail:
        msg: |
          La red libvirt '{{ vm_network }}' no está definida o no está activa.
          El playbook no la arranca. En el host:

            sudo virsh --connect {{ libvirt_uri }} net-start {{ vm_network }}

          Si no existe:

            sudo virsh --connect {{ libvirt_uri }} net-define /usr/share/libvirt/networks/default.xml
            sudo virsh --connect {{ libvirt_uri }} net-start {{ vm_network }}
      when: net_default.rc != 0 or not (net_default.stdout is search("Active:\\s+yes"))
      tags: [check]

    - name: ISO presente
      ansible.builtin.stat:
        path: "{{ omarchy_iso }}"
      register: iso
      tags: [check]

    - name: Fallar si falta la ISO
      ansible.builtin.fail:
        msg: >-
          No está la ISO en {{ omarchy_iso }}.
          Pasá -e omarchy_iso=/ruta/omarchy.iso
          (https://iso.omarchy.org/omarchy-4.0.4.iso).
      when: not iso.stat.exists
      tags: [check]

    - name: Tirar leftover de una corrida anterior
      ansible.builtin.include_tasks: tasks/teardown.yml

    - name: Directorio de imágenes de esta VM
      ansible.builtin.file:
        path: "{{ vm_dir }}"
        state: directory
        mode: "0755"

    - name: Disco raw sparse
      ansible.builtin.command:
        argv:
          - qemu-img
          - create
          - -f
          - raw
          - "{{ vm_raw_path }}"
          - "{{ vm_disk_gib }}G"
      args:
        creates: "{{ vm_raw_path }}"

    - name: Particionar 50% libre + ext4 backup (sin ESP, sin root)
      ansible.builtin.shell: |
        set -euo pipefail
        RAW="{{ vm_raw_path }}"
        QCOW="{{ vm_disk_path }}"
        parted --script "$RAW" \
          mklabel gpt \
          mkpart backup 50% 100% \
          name 1 backup
        line=$(parted --script -m "$RAW" unit B print | grep '^1:')
        start=${line#*:}
        start=${start%%B*}
        size=$(printf '%s\n' "$line" | cut -d: -f4)
        size=${size%B}
        blocks=$(( size / 4096 ))
        mkfs.ext4 -F -L backup -E "offset=${start}" "$RAW" "$blocks"
        qemu-img convert -f raw -O qcow2 "$RAW" "$QCOW"
        rm -f "$RAW"
      args:
        executable: /bin/bash
      changed_when: true

    - name: Definir e iniciar VM
      ansible.builtin.command:
        argv: "{{ virt_install_base + (['--transient'] if vm_transient | bool else []) }}"
      vars:
        virt_install_base:
          - virt-install
          - --connect
          - "{{ libvirt_uri }}"
          - --name
          - "{{ vm_name }}"
          - --memory
          - "{{ vm_memory_mib }}"
          - --vcpus
          - "{{ vm_vcpus }}"
          - --cpu
          - host-passthrough
          - --machine
          - q35
          - --virt-type
          - kvm
          - --disk
          - "path={{ vm_disk_path }},format=qcow2,bus=virtio,cache=none,discard=unmap"
          - --cdrom
          - "{{ omarchy_iso }}"
          - --os-variant
          - archlinux
          - --network
          - "network={{ vm_network }},model=virtio"
          - --graphics
          - spice
          - --video
          - virtio
          - --boot
          - firmware=efi,firmware.feature0.name=secure-boot,firmware.feature0.enabled=no,cdrom,hd
          - --noautoconsole
          - --wait
          - "0"
          - --check
          - all=off
      register: virt_install

    - name: Recordatorio
      ansible.builtin.debug:
        msg:
          - "VM {{ vm_name }} levantada ({{ 'transiente' if vm_transient | bool else 'persistente' }})."
          - "Consola: virt-viewer --connect {{ libvirt_uri }} {{ vm_name }}"
          - "Disco vda = {{ vm_disk_gib }} G, 50% libre + ext4 backup. Sin ESP."
          - "En el instalador: disco vda → Free space install (no wipe)."
          - "El fallo es inmediato (parted + mkfs + mount ESP), no la copia del ISO."
          - "Error esperado: mounting the ESP failed / SQUASHFS superblock."
          - "Borrar todo: ansible-playbook playbook.yml --tags down"

- name: Tirar la VM y el disco
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [never, down]
  vars_files:
    - vars.yml
  tasks:
    - name: Teardown
      ansible.builtin.include_tasks: tasks/teardown.yml

    - name: Listo
      ansible.builtin.debug:
        msg: "VM {{ vm_name }} y {{ vm_dir }} borrados."
