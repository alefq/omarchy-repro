---
- name: Destroy the VM if it exists
  ansible.builtin.command:
    argv: [virsh, --connect, "{{ libvirt_uri }}", destroy, "{{ vm_name }}"]
  register: virsh_destroy
  failed_when: false
  changed_when: virsh_destroy.rc == 0

- name: Undefine the VM (UEFI NVRAM + disks)
  ansible.builtin.command:
    argv:
      - virsh
      - --connect
      - "{{ libvirt_uri }}"
      - undefine
      - "{{ vm_name }}"
      - --nvram
      - --remove-all-storage
  register: virsh_undefine
  failed_when: false
  changed_when: virsh_undefine.rc == 0

- name: Undefine the VM (no storage, if the previous step failed)
  ansible.builtin.command:
    argv:
      - virsh
      - --connect
      - "{{ libvirt_uri }}"
      - undefine
      - "{{ vm_name }}"
      - --nvram
  register: virsh_undefine_nvram
  failed_when: false
  changed_when: virsh_undefine_nvram.rc == 0

- name: Remove the VM disk and directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ vm_disk_path }}"
    - "{{ vm_raw_path }}"
    - "{{ vm_dir }}"
